services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-${DATABASE_URL:-postgresql://postgres:postgres@host.docker.internal:54322/postgres}}
      SUPABASE_URL: ${DOCKER_SUPABASE_URL:-http://host.docker.internal:54321}
      # Local tokens name the browser-visible issuer, even though the
      # container reaches the same service through host.docker.internal.
      SUPABASE_JWT_ISSUER: ${SUPABASE_JWT_ISSUER:-http://127.0.0.1:54321/auth/v1}
      VIDEO_MEDIA_ROOT: /var/lib/agentic-study-partner/video-media
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      - video-media:/var/lib/agentic-study-partner/video-media
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      # The image selects its role from START_COMMAND, the same way the
      # deployed worker service does.
      START_COMMAND: python -m worker.main
      DATABASE_URL: ${DOCKER_DATABASE_URL:-${DATABASE_URL:-postgresql://postgres:postgres@host.docker.internal:54322/postgres}}
      SUPABASE_URL: ${DOCKER_SUPABASE_URL:-http://host.docker.internal:54321}
      VIDEO_MEDIA_ROOT: /var/lib/agentic-study-partner/video-media
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # No published port: the worker polls Postgres and serves no traffic.
    restart: unless-stopped
    volumes:
      - video-media:/var/lib/agentic-study-partner/video-media

  web:
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        BACKEND_URL: http://api:8000
        # The browser signs in and uploads against Supabase directly, so these
        # must be reachable from the host browser, not from inside Compose.
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-http://127.0.0.1:54321}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
        NEXT_PUBLIC_DEMO_LOGIN_EMAIL: ${NEXT_PUBLIC_DEMO_LOGIN_EMAIL:-}
        NEXT_PUBLIC_DEMO_LOGIN_PASSWORD: ${NEXT_PUBLIC_DEMO_LOGIN_PASSWORD:-}
        NEXT_PUBLIC_API_ORIGIN: ${NEXT_PUBLIC_API_ORIGIN:-http://127.0.0.1:8000}
    environment:
      BACKEND_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  video-media:
