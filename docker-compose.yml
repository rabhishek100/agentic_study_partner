services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      EMBEDDING_DEVICE: cpu
      RERANKER_DEVICE: cpu
    volumes:
      - ./data:/app/data
      - huggingface-cache:/root/.cache/huggingface
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 20s

  web:
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        BACKEND_URL: http://api:8000
    environment:
      BACKEND_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  huggingface-cache:
