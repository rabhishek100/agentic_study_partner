<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <!--
    The Mugensei mark, the same geometry the component draws at every size:
    three scattered pieces of evidence converging at 45 degrees on one square,
    where separate evidence becomes connected understanding. The terminal square
    is the vermilion seal.

    Colours are literal because a favicon has no stylesheet to inherit tokens
    from. These are the sumi-theme values, which hold on light and dark chrome.
  -->
  <g transform="translate(1 0)">
    <g fill="none" stroke="#69d39f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7.4 7.7H14.7L27 20"/>
      <path d="M6.2 20H27"/>
      <path d="M7.4 32.3H14.7L27 20"/>
    </g>
    <g fill="#f2eee4">
      <rect x="4" y="6" width="3.4" height="3.4"/>
      <rect x="2.8" y="18.3" width="3.4" height="3.4"/>
      <rect x="4" y="30.6" width="3.4" height="3.4"/>
    </g>
    <rect x="27" y="16" width="8" height="8" fill="#e97850"/>
  </g>
</svg>
