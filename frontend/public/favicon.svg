    <path d="M20.1 28.4c3.1-2.3 7.7-3.3 12.7-2.9v7.8c-5-.4-9.6.6-12.7 3Z"/>
  </g>
  <path d="M19.4 27.6C20.2 22.8 26.8 21.8 26.6 16.6 26.4 10.8 14 11.6 14.8 5.8 15.2 3 16.8 1.4 18 0"
        fill="none" stroke="#69d39f" stroke-width="2.6" stroke-linecap="round"/>
  <g fill="#f2eee4" stroke="#070b0a" stroke-width="0.9">
    <circle cx="23.4" cy="22.3" r="2.5"/>
    <circle cx="20.3" cy="11.2" r="3.1"/>
    <circle cx="15.3" cy="3.9" r="3.7"/>
  </g>
  <rect x="33.6" y="29.6" width="5.8" height="5.8" fill="#e97850"/>
