<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <!--
    The Mugensei mark at favicon size, drawn as the `sm` redraw rather than a
    scaled `md`: heavier path, larger nodes, larger seal. Colours are literal
    here because a favicon has no stylesheet to inherit tokens from; they are
    the sumi-theme values, which hold on both light and dark browser chrome.
  -->
