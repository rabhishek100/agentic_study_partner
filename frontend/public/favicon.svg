<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <!--
    The Mugensei mark in its compact geometry — the same simplification the
    24px component uses. Three separate nodes cannot resolve at favicon density,
    so the compact mark carries the book, one heavier ribbon, and the seal; the
    nodes appear at every size where they can be seen.

    Colours are literal because a favicon has no stylesheet to inherit tokens
    from. These are the sumi-theme values, which hold on light and dark chrome.
  -->
  <g fill="#f2eee4">
    <path d="M18.6 27.8C14.6 24.9 8 23.9 1.6 24.7v10.8c6.4-.8 13 .2 17 3.1Z"/>
    <path d="M21.4 27.8c4-2.9 10.6-3.9 17-3.1v10.8c-6.4-.8-13 .2-17 3.1Z"/>
  </g>
  <path d="M20 26.4C22 19.6 29.4 18 28.6 11.4 27.9 5.6 22.6 4 21.4 0"
        fill="none" stroke="#69d39f" stroke-width="3.4" stroke-linecap="round"/>
  <rect x="32.6" y="29.8" width="6.6" height="6.6" fill="#e97850"/>
</svg>
