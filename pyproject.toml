[project]
name = "agentic-study-partner"
version = "0.1.0"
description = "Evaluation-driven hierarchical RAG over technical books"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "pymupdf>=1.28.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "tiktoken>=0.13.0",
    "unstructured[pdf]>=0.24.1",
    "langchain-openai>=1.3.5",
    "langgraph>=1.0,<2",
    "httpx>=0.28,<1",
    "numpy>=2.0,<3",
    "opencv-python-headless>=4.10,<5",
    "uvicorn[standard]>=0.34,<1",
    "psycopg[binary,pool]>=3.2,<4",
    "pgvector>=0.4,<1",
    # Transitive deps of unstructured[pdf]'s PDF layout detection model, not
    # imported directly. Listed explicitly so tool.uv.sources below can pin
    # them to the CPU-only wheel index instead of torch's default CUDA build.
    "torch>=2.10",
    "torchvision",
    "pyjwt[crypto]>=2.10,<3",
    "yt-dlp>=2025.12.8,<2027",
    "duckduckgo-search>=8.1.1",
    "tzdata>=2025.2",
]

[dependency-groups]
dev = [
    "markdown-it-py>=4,<5",
    "pytest>=9,<10",
]

# See the torch/torchvision comment above: a Linux install shouldn't pull
# torch's default CUDA runtime packages for a model that never needs a GPU.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
