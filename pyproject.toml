[project]
name = "agentic-study-partner"
version = "0.1.0"
description = "Evaluation-driven hierarchical RAG over technical books"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "gradio>=6.0,<7",
    "pymupdf>=1.28.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "tiktoken>=0.13.0",
    "unstructured[pdf]>=0.24.1",
    "langchain-openai>=1.3.5",
    "langgraph>=1.0,<2",
    "markdown-it-py>=4,<5",
    "chromadb>=1.5.9,<2",
    "sentence-transformers>=5.6,<6",
    "torch>=2.6",
    "torchvision>=0.21",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
